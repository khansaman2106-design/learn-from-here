<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Learn From Here</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="../../index.html">Learn From Here</a></header>
<main class="page-container"><section class="card">
  <h1>Share your feedback</h1>
  <form action="../../../backend/feedback/submit-feedback.php" method="post">
    <div class="form-group"><label for="name">Name</label><input id="name" name="name" required></div>
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="form-group"><label for="rating">Rating</label><select id="rating" name="rating" required><option value="">Choose a rating</option><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Needs improvement</option></select></div>
    <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
    <button class="button" type="submit">Submit feedback</button>
  </form>
</section></main>
</body></html>

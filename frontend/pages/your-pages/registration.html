<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration | Learn From Here</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="../../index.html">Learn From Here</a></header>
<main class="page-container"><section class="card">
  <h1>Create your account</h1>
  <form action="../../../backend/auth/register.php" method="post">
    <div class="form-group"><label for="name">Full name</label><input id="name" name="name" required></div>
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="form-group"><label for="password">Password (minimum 8 characters)</label><input id="password" name="password" type="password" minlength="8" required></div>
    <button class="button" type="submit">Register</button>
  </form>
</section></main>
</body></html>
